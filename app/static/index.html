<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal Scope</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/report.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="/static/icon.svg" alt=""> Journal Scope</div>
    <h4>History</h4>
    <ul id="history" class="history"></ul>
    <div id="sync" class="sync"></div>
  </aside>
  <div class="main">
    <form id="search" autocomplete="off">
      <label class="field grow">
        <span>Journal title or ISSN</span>
        <input id="q" name="q" required placeholder="e.g. 1532-0464 or Journal of Biomedical Informatics">
      </label>
      <label class="field">
        <span>Journal website <em>(optional)</em></span>
        <input id="site" name="site" placeholder="Overrides the homepage found">
      </label>
      <button type="submit" id="go">Check journal</button>
    </form>
    <div id="status" class="status" hidden></div>
    <section id="out"></section>
    <p class="foot">Values are copied from each source as published there; follow the links to verify. Nothing is scored or inferred.</p>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
